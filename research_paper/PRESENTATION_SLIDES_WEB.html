let currentSlide = 0;

function renderSlide() {
    const slide = slides[currentSlide];
    const container = document.getElementById("slideBox");
    container.innerHTML = `
        <div class="slide-header">
            <div class="slide-title">${slide.title}</div>
            <div class="slide-badge">${slide.badge}</div>
        </div>
        <div class="slide-content">
            ${slide.content}
        </div>
        <div class="slide-footer">
            <span>PhishGuard-XAI: Academic Research Presentation</span>
            <span>Slide ${currentSlide + 1} of ${slides.length}</span>
        </div>
    `;
    document.getElementById("slideNum").innerText = `Slide ${currentSlide + 1} of ${slides.length}`;
}

function nextSlide() {
    if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide();
    }
}

function prevSlide() {
    if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
    }
}

function toggleFullScreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
}

document.addEventListener("keydown", function(event) {
    if (event.key === "ArrowRight" || event.key === " " || event.key === "PageDown") {
        nextSlide();
    } else if (event.key === "ArrowLeft" || event.key === "PageUp") {
        prevSlide();
    } else if (event.key === "f" || event.key === "F") {
        toggleFullScreen();
    }
});

renderSlide();
</script>
</body>
</html>
